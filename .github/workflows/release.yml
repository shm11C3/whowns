name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify tag matches Cargo package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          tag_version=${GITHUB_REF_NAME#v}
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "tag version $tag_version does not match Cargo.toml $package_version" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test installer
        run: sh tests/install.sh

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            install_musl: false
          - runner: macos-15
            target: aarch64-apple-darwin
            install_musl: false
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            install_musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            install_musl: true
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install musl build tools
        if: matrix.install_musl == true
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Run target tests
        run: cargo test --locked --all-targets --target ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test binaries
        run: |
          target/${{ matrix.target }}/release/whowns --version

      - name: Package release archive
        id: package
        shell: bash
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          package_name="whowns-v${version}-${{ matrix.target }}"
          archive_name="${package_name}.tar.gz"
          mkdir -p "dist/${package_name}"
          cp "target/${{ matrix.target }}/release/whowns" "dist/${package_name}/"
          cp README.md README.ja.md LICENSE scripts/install.sh "dist/${package_name}/"
          chmod 0755 "dist/${package_name}/whowns" "dist/${package_name}/install.sh"
          tar -czf "dist/${archive_name}" -C dist "${package_name}"
          echo "archive=dist/${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Attest release archive
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Stage curl installer
        run: install -m 0755 scripts/install.sh dist/install.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz ./install.sh > SHA256SUMS

      - name: Attest curl installer
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/install.sh

      - name: Attest checksum manifest
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/SHA256SUMS

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)
          release_args=(--verify-tag --generate-notes)
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${release_args[@]}"
